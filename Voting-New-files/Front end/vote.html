<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Online Voting System</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f2f4f8; display: flex; justify-content: center; padding: 30px; }
    .box { background: #fff; padding: 24px; border-radius: 10px; width: 100%; max-width: 420px; box-shadow: 0 2px 10px rgba(0,0,0,.1); }
    h2 { margin-top: 0; text-align: center; }
    label { display: block; margin-top: 12px; font-weight: bold; font-size: 14px; }
    input, select, button { width: 100%; padding: 10px; margin-top: 6px; box-sizing: border-box; font-size: 15px; }
    button { background: #2563eb; color: #fff; border: 0; border-radius: 6px; margin-top: 18px; cursor: pointer; }
    #msg { margin-top: 16px; text-align: center; font-weight: bold; }
    .ok { color: green; } .err { color: red; }
    small { color: #666; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Online Voting System</h2>

    <label>Voter ID</label>
    <input id="voterId" placeholder="Example: SYK2121150" maxlength="10">

    <label>Name <small>(only for new voters)</small></label>
    <input id="name" placeholder="Your name">

    <label>Password</label>
    <input id="password" type="password" placeholder="Password">

    <label>Select Party</label>
    <select id="partyId"></select>

    <button onclick="submitVote()">Vote</button>
    <div id="msg"></div>
  </div>
  <script src="./vote.js"></script>
</body>
</html>
